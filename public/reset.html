<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actualizando…</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#fafafa;color:#18181b;display:flex;min-height:100vh;align-items:center;justify-content:center}div{text-align:center;padding:16px}p{color:#52525b}</style></head>
<body><div><h2>Actualizando Return Checks…</h2><p id="m">Limpiando la versión anterior</p></div>
<script>
(async function(){
  try{var r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(function(x){return x.unregister()}))}catch(e){}
  try{var k=await caches.keys();await Promise.all(k.map(function(x){return caches.delete(x)}))}catch(e){}
  try{sessionStorage.clear()}catch(e){}
  document.getElementById('m').textContent='Listo, abriendo…';
  setTimeout(function(){location.replace('/app?v='+Date.now())},400);
})();
</script></body></html>
