<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Returned Checks</title>
  <style>
    :root{
      --bg:#f4f6fb;
      --ink:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --accent:#d11b2a;
      --label:#a6a6a6;
      --shadow: 0 18px 60px rgba(0,0,0,.10);
      --radius:16px;

      /* Paper sizing */
      --paper-w: 860px;
      --paper-pad-x: 34px;
      --paper-pad-y: 26px;
      --paper-ratio: 1.294; /* 11/8.5 */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--ink);
      background: radial-gradient(1000px 500px at 20% 0%, rgba(209,27,42,.08), transparent 60%),
                  radial-gradient(900px 600px at 85% 20%, rgba(16,185,129,.08), transparent 55%),
                  var(--bg);
    }

    .topbar{
      position:sticky; top:0; z-index:50;
      display:flex; align-items:center; gap:12px;
      padding:12px 14px;
      background: rgba(255,255,255,.78);
      backdrop-filter: blur(10px);
      border-bottom:1px solid rgba(229,231,235,.85);
    }
    .brand{display:flex; align-items:center; gap:10px; min-width: 220px;}
    .logoDot{
      width:34px; height:34px; border-radius:12px;
      background: linear-gradient(135deg, rgba(209,27,42,.95), rgba(245,158,11,.95));
      box-shadow: 0 10px 20px rgba(209,27,42,.18);
    }
    .brandTitle{display:flex; flex-direction:column; line-height:1.05;}
    .brandTitle b{font-size:14px}
    .brandTitle span{font-size:12px; color:var(--muted)}

    .topbarRight{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      border:1px solid var(--line);
      background:#fff;
      padding:10px 12px;
      border-radius:14px;
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,.06);
      font-weight:800;
      font-size:13px;
      display:inline-flex; align-items:center; gap:8px;
      user-select:none;
      white-space:nowrap;
    }
    .btn:active{transform: translateY(1px)}
    .btnPrimary{
      border-color: rgba(209,27,42,.35);
      background: linear-gradient(180deg, rgba(209,27,42,.96), rgba(209,27,42,.90));
      color:#fff;
      box-shadow: 0 14px 26px rgba(209,27,42,.20);
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      padding: 8px 10px;
      border-radius: 14px;
      border:1px dashed rgba(107,114,128,.35);
      background: rgba(243,244,246,.55);
    }

    .shell{
      padding: 14px;
      display:flex;
      justify-content:center;
    }

    .paper{
      width: min(var(--paper-w), 100%);
      background:#fff;
      border:1px solid rgba(209,27,42,.15);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: var(--paper-pad-y) var(--paper-pad-x);
      position:relative;
      overflow:hidden;
    }
    .paper:before{
      content:"";
      position:absolute; inset:0;
      border-radius: 18px;
      pointer-events:none;
      box-shadow: inset 0 0 0 1px rgba(17,24,39,.05);
    }

    .paperTop{
      display:grid;
      grid-template-columns: 1.2fr 1.1fr;
      gap: 10px;
      align-items:start;
    }
    .companyBlock{display:flex; flex-direction:column; gap:8px;}
    .companyName{
      font-size: 26px;
      letter-spacing:.5px;
      border:0;
      outline:0;
      padding:0 0 6px 0;
      border-bottom: 2px solid rgba(17,24,39,.15);
      width:100%;
      font-weight: 300;
      text-transform: uppercase;
      background: transparent;
    }
    .subline{display:flex; gap:10px; flex-wrap:wrap; color: var(--muted); font-size: 12px;}
    .storeInfo{
      text-align:left;
      font-size:12.5px;
      line-height: 1.35;
      color:#111827;
    }
    .storeInfo b{letter-spacing:.4px;}
    .storeHeader{
      display:flex;
      justify-content:flex-end;
      align-items:flex-end;
      margin-bottom: 6px;
    }
    .lpLogo{
      width: 170px;
      max-width: 100%;
      height: auto;
      object-fit: contain;
      display:block;
    }

    .titleCenter{
      margin: 16px 0 10px 0;
      text-align:center;
      font-size: 28px;
      letter-spacing:.8px;
      color: var(--accent);
      font-weight: 900;
      text-transform: uppercase;
    }

    table{width:100%; border-collapse:collapse; table-layout:fixed; font-size: 13px;}
    .gridBlock{border:1px solid rgba(17,24,39,.35);}
    .gridBlock td{border:1px solid rgba(17,24,39,.35); padding:8px 10px; vertical-align:middle;}
    .labelCell{
      width: 30%;
      background: var(--label);
      color:#0b0b0b;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing:.2px;
      text-align:center;
      font-size: 12px;
      line-height: 1.1;
    }
    .valueCell{background:#fff;}
    .valueCell input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      font-size: 13px;
      padding:0;
    }
    .valueCell input::placeholder{
      color: rgba(17,24,39,.35);
      font-weight: 700;
      letter-spacing: .1px;
    }

    .moneyRow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
      align-items:start;
    }
    .miniBlock{border:1px solid rgba(17,24,39,.35);}
    .miniBlock td{border:1px solid rgba(17,24,39,.35); padding:8px 10px; font-size: 13px;}

    .imagesSection{margin-top: 14px;}
    .imagesHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border:1px solid rgba(229,231,235,.9);
      border-radius: 16px;
      background: rgba(255,255,255,.72);
    }
    .imagesHead b{font-size:13px}
    .imagesHead span{font-size:12px; color:var(--muted)}
    .imagesPages{
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:center;
      margin-top: 10px;
    }
    .imagePaper{padding: 18px 18px;}
    .imageTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding-bottom:10px;
      border-bottom: 1px solid rgba(229,231,235,.9);
      margin-bottom: 12px;
    }
    .imageTop .name{
      min-width:0;
      font-size:13px;
      font-weight:900;
      color:#111827;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .imageTop .metaSmall{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .miniBtn{
      border:1px solid rgba(229,231,235,.95);
      background:#fff;
      border-radius: 12px;
      padding:8px 10px;
      cursor:pointer;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .miniBtnDanger{
      border-color: rgba(239,68,68,.35);
      color:#fff;
      background: linear-gradient(180deg, rgba(239,68,68,.96), rgba(239,68,68,.90));
    }
    .imageBody{display:flex; justify-content:center; align-items:center; padding: 6px 0 2px 0;}
    .imageBody img{
      width: 100%;
      height: auto;
      max-height: calc((var(--paper-w) * var(--paper-ratio)) - 140px);
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid rgba(229,231,235,.9);
      box-shadow: 0 12px 26px rgba(0,0,0,.08);
      cursor:pointer;
      background:#fff;
    }
    .imagesEmpty{
      margin-top: 10px;
      padding: 14px;
      text-align:center;
      color: var(--muted);
      font-weight: 800;
      border: 1px dashed rgba(107,114,128,.35);
      border-radius: 16px;
      background: rgba(243,244,246,.55);
    }

    /* Modal */
    .modal{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding: 16px;
    }
    .modal.show{display:flex}
    .modalCard{
      width: min(980px, 100%);
      background:#fff;
      border-radius: 18px;
      border:1px solid rgba(229,231,235,.95);
      box-shadow: 0 30px 80px rgba(0,0,0,.22);
      overflow:hidden;
    }
    .modalTop{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding: 10px 12px;
      border-bottom:1px solid rgba(229,231,235,.95);
    }
    .modalTop b{font-size:13px}
    .modalBody{
      padding: 12px;
      background: #0b1220;
      display:flex;
      justify-content:center;
    }
    .modalBody img{
      max-width:100%;
      max-height: 70vh;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    /* Mobile */
    @media (max-width: 520px){
      :root{
        --paper-pad-x: 14px;
        --paper-pad-y: 14px;
      }
      .topbar{padding:10px 10px;}
      .brand{min-width:auto}
      .brandTitle b{font-size:13px}
      .brandTitle span{font-size:11px}
      .btn{padding:8px 10px; border-radius:12px; font-size:12px;}
      .shell{padding: 10px;}
      .paperTop{grid-template-columns: 1fr; gap: 12px;}
      .companyName{font-size: 18px;}
      .storeInfo{font-size: 11.5px;}
      .lpLogo{width: 140px;}
      .titleCenter{font-size: 20px; margin: 12px 0 8px 0;}
      table{font-size: 11.5px;}
      .labelCell{font-size: 10px; width: 34%;}
      .gridBlock td{padding: 6px 7px;}
      .valueCell input{font-size: 12px;}
      .moneyRow{grid-template-columns: 1fr; gap: 10px;}
      .miniBlock td{padding: 6px 7px; font-size: 12px;}
    }

    /* Print */
    @media print{
      @page { size: letter; margin: 0.35in; }
      html, body { height: auto !important; }
      body{background:#fff}
      .topbar{display:none !important}
      .imagesHead{display:none !important}
      .miniBtn{display:none !important}
      .shell{padding:0 !important}
      .imagesSection{margin-top:0 !important}
      /* Never print placeholder helper text */
      input::placeholder{ color: transparent !important; }

      /* Each section = one page */
      #paper{ break-after: page; page-break-after: always; }
      /* Each image = one page (avoid blank pages from break-before) */
      #imagePages .imagePaper{ break-after: page; page-break-after: always; }
      #imagePages .imagePaper:last-child{ break-after: auto; page-break-after: auto; }

      /* Image pages: print only the image (no header), no padding so it fills */
      #imagePages .imageTop{ display:none !important; }
      #imagePages .imagePaper{
        padding: 0 !important;
        border: 1px solid #000 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        overflow: hidden !important;
        break-inside: avoid-page;
        page-break-inside: avoid;
      }
      #imagePages .imageBody{
        padding: 0 !important;
        margin: 0 !important;
        display:flex !important;
        align-items:center !important;
        justify-content:center !important;
        height: auto !important;
      }
      #imagePages .imageBody img{
        display:block !important;
        width: 100% !important;
        max-width: 100% !important;
        height: 10.2in !important;
        /* 11in page height - 0.7in margins = 10.3in (safe a bit lower) */
        object-fit: contain !important;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background:#fff !important;
      }

      .paper{
        box-shadow:none !important;
        border: 1px solid #000 !important;
        border-radius:0 !important;
        width: 100% !important;
        max-width: none !important;
        overflow: visible !important;
        break-inside: avoid-page;
        page-break-inside: avoid;
      }
      .lpLogo{
        width: 180px !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logoDot"></div>
      <div class="brandTitle">
        <b>Returned Checks</b>
        <span>Reporte editable</span>
      </div>
    </div>
    <div class="topbarRight">
      <div class="pill" id="lastSaved">Sin cambios</div>
      <input id="imgPicker" type="file" accept="image/*" multiple style="display:none" />
      <button class="btn" id="btnAddImages">Agregar imágenes</button>
      <button class="btn btnPrimary" id="btnPrint">Imprimir</button>
    </div>
  </div>

  <div class="shell">
    <div style="width:min(var(--paper-w),100%);">
      <div class="paper" id="paper"></div>

      <div class="imagesSection">
        <div class="imagesHead">
          <div>
            <b>Imágenes</b>
            <span id="attCount">0</span>
          </div>
        </div>
        <div class="imagesPages" id="imagePages"></div>
        <div class="imagesEmpty" id="imagesEmpty" style="display:none;">No hay imágenes. Usa “Agregar imágenes”.</div>
      </div>
    </div>
  </div>

  <template id="paperTemplate">
    <div>
      <div class="paperTop">
        <div class="companyBlock">
          <input class="companyName" data-field="companyName" placeholder="COMPANY NAME" />
          <div class="subline">
            <span>Last updated:</span>
            <span data-live="updatedAt">—</span>
          </div>
        </div>

        <div class="storeInfo">
          <div class="storeHeader">
            <img
              class="lpLogo"
              src="/appreporte/lp-logo.png"
              alt="La Primavera"
              loading="eager"
              onerror="this.style.display='none'"
            />
          </div>
          <b>LA PRIMAVERA SUPERMARKET INC</b><br/>
          CHECK CASHING SERVICES<br/>
          901 N WASHINGTON BLVD<br/>
          SARASOTA FL, 34236<br/>
          941 366 5321
        </div>
      </div>

      <div class="titleCenter">RETURNED CHECK REPORT</div>

      <table class="gridBlock">
        <tr><td class="labelCell">DATE CASHED</td><td class="valueCell"><input data-field="dateCashed" placeholder="RELLENAR" /></td></tr>
        <tr><td class="labelCell">DATE OF DEPOSIT</td><td class="valueCell"><input data-field="dateDeposit" placeholder="RELLENAR" /></td></tr>
        <tr><td class="labelCell">DATE RETURNED</td><td class="valueCell"><input data-field="dateReturned" placeholder="RELLENAR" /></td></tr>
        <tr><td class="labelCell">PAYEE</td><td class="valueCell"><input data-field="payee" placeholder="RELLENAR" /></td></tr>
        <tr><td class="labelCell">CHECK NUMBER</td><td class="valueCell"><input data-field="checkNumber" placeholder="RELLENAR" /></td></tr>
        <tr><td class="labelCell">MAKER/PAYOR</td><td class="valueCell"><input data-field="makerPayor" placeholder="RELLENAR" /></td></tr>
        <tr><td class="labelCell">REJECT REASON</td><td class="valueCell"><input data-field="rejectReason" placeholder="RELLENAR" /></td></tr>
        <tr><td class="labelCell">CUSTOMER CONTACT</td><td class="valueCell"><input data-field="customerContact" placeholder="RELLENAR" /></td></tr>
        <tr><td class="labelCell">COMPANY CONTACT</td><td class="valueCell"><input data-field="companyContact" placeholder="RELLENAR" /></td></tr>
      </table>

      <div class="moneyRow">
        <table class="miniBlock">
          <tr><td class="labelCell">CHECK AMOUNT</td><td class="valueCell"><input data-field="checkAmount" placeholder="$0.00" /></td></tr>
          <tr><td class="labelCell">RETURNED CHECK FEE</td><td class="valueCell"><input data-field="returnedFee" placeholder="$0.00" /></td></tr>
          <tr><td class="labelCell">TOTAL DUE</td><td class="valueCell"><input data-field="totalDue" placeholder="$0.00" readonly /></td></tr>
        </table>
        <table class="miniBlock">
          <tr><td class="labelCell">DATE FEE PAID</td><td class="valueCell"><input data-field="dateFeePaid" placeholder="RELLENAR" /></td></tr>
          <tr><td class="labelCell">FORM OF PAYMENT</td><td class="valueCell"><input data-field="feePaymentMethod" placeholder="RELLENAR" /></td></tr>
          <tr><td class="labelCell">DATE CHECK PAID</td><td class="valueCell"><input data-field="dateCheckPaid" placeholder="RELLENAR" /></td></tr>
          <tr><td class="labelCell">FORM OF PAYMENT</td><td class="valueCell"><input data-field="checkPaymentMethod" placeholder="RELLENAR" /></td></tr>
        </table>
      </div>

      <div style="margin-top:16px;">
        <table class="miniBlock">
          <tr>
            <td class="labelCell">DATE COMPLETED</td>
            <td class="valueCell"><input data-field="dateCompleted" placeholder="RELLENAR" /></td>
            <td class="labelCell" style="width:22%">AGENT</td>
            <td class="valueCell"><input data-field="agentCompleted" placeholder="RELLENAR" /></td>
          </tr>
        </table>
      </div>
    </div>
  </template>

  <!-- Image modal -->
  <div class="modal" id="modal">
    <div class="modalCard">
      <div class="modalTop">
        <b id="modalTitle">Imagen</b>
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="btn" id="modalClose">Cerrar</button>
          <button class="btn btnDanger" id="modalDelete">Borrar</button>
        </div>
      </div>
      <div class="modalBody">
        <img id="modalImg" alt="preview" />
      </div>
    </div>
  </div>

  <script>
    (() => {
      const qs = new URLSearchParams(location.search);
      const noteId = qs.get("noteId") || "global";
      const initialCompanyName = (qs.get("companyName") || "").trim();
      const STORAGE_KEY = `returnedChecks.v3:${noteId}`;
      const legacyKeyV2 = `returnedChecks.v2:${noteId}`;

      const canPostToParent = (() => {
        try { return window.parent && window.parent !== window; } catch { return false; }
      })();

      const nowISO = () => new Date().toISOString();
      const fmtDateTime = (iso) => {
        try{
          const d = new Date(iso);
          return d.toLocaleString(undefined, {year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit"});
        }catch{ return "—"; }
      };
      const moneyToNumber = (v) => {
        if (v == null) return 0;
        const s = String(v).replace(/[^0-9.\-]/g,"").trim();
        const n = Number(s);
        return Number.isFinite(n) ? n : 0;
      };
      const formatMoney = (n) => {
        const x = Number(n);
        if (!Number.isFinite(x)) return "";
        return "$" + x.toFixed(2);
      };
      const uid = () => (crypto?.randomUUID ? crypto.randomUUID() : ("id-" + Math.random().toString(16).slice(2) + Date.now()));

      const el = {
        paper: document.getElementById("paper"),
        paperTemplate: document.getElementById("paperTemplate"),
        lastSaved: document.getElementById("lastSaved"),
        btnPrint: document.getElementById("btnPrint"),
        btnAddImages: document.getElementById("btnAddImages"),
        imgPicker: document.getElementById("imgPicker"),
        imagePages: document.getElementById("imagePages"),
        imagesEmpty: document.getElementById("imagesEmpty"),
        attCount: document.getElementById("attCount"),
        modal: document.getElementById("modal"),
        modalImg: document.getElementById("modalImg"),
        modalTitle: document.getElementById("modalTitle"),
        modalClose: document.getElementById("modalClose"),
        modalDelete: document.getElementById("modalDelete"),
      };

      let report = null; // {id, createdAt, updatedAt, fields, images}
      let activePaper = null;
      let saveTimer = null;
      let toastTimer = null;
      let modalImageId = null;

      const blankReport = () => ({
        id: uid(),
        createdAt: nowISO(),
        updatedAt: nowISO(),
        fields: {
          companyName: initialCompanyName ? initialCompanyName.toUpperCase() : "",
          dateCashed: "",
          dateDeposit: "",
          dateReturned: "",
          payee: "",
          checkNumber: "",
          makerPayor: "",
          rejectReason: "",
          customerContact: "",
          companyContact: "",
          checkAmount: "",
          returnedFee: "",
          totalDue: "$0.00",
          dateFeePaid: "",
          feePaymentMethod: "",
          dateCheckPaid: "",
          checkPaymentMethod: "",
          dateCompleted: "",
          agentCompleted: ""
        },
        images: [] // {id, name, dataUrl, createdAt}
      });

      const normalizeFromLegacy = (maybe) => {
        // If coming from older multi-report payload, pick active or first.
        if (!maybe || typeof maybe !== "object") return null;
        if (Array.isArray(maybe.reports)) {
          const list = maybe.reports || [];
          const activeId = maybe.activeId || null;
          const pick = list.find(r => r && r.id === activeId) || list[0] || null;
          if (pick && pick.fields) {
            return {
              id: pick.id || uid(),
              createdAt: pick.createdAt || nowISO(),
              updatedAt: pick.updatedAt || nowISO(),
              fields: pick.fields || {},
              images: pick.images || [],
            };
          }
        }
        if (maybe.fields && typeof maybe.fields === "object") {
          return {
            id: maybe.id || uid(),
            createdAt: maybe.createdAt || nowISO(),
            updatedAt: maybe.updatedAt || nowISO(),
            fields: maybe.fields || {},
            images: maybe.images || [],
          };
        }
        return null;
      };

      const persist = (silent=false) => {
        if (!report) return;
        report.updatedAt = nowISO();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(report));
        } catch {}
        el.lastSaved.textContent = silent ? `Última edición: ${fmtDateTime(report.updatedAt)}` : "Guardando…";

        if (canPostToParent) {
          try {
            window.parent.postMessage({ type: "rc:save", noteId, payload: report }, "*");
          } catch {}
        }
      };

      const scheduleSave = () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          persist(true);
        }, 350);
      };

      const computeTotalDue = () => {
        const total = moneyToNumber(report.fields.checkAmount) + moneyToNumber(report.fields.returnedFee);
        report.fields.totalDue = formatMoney(total);
      };

      const buildPaper = () => {
        const frag = el.paperTemplate.content.cloneNode(true);
        const node = frag.firstElementChild;
        const updated = node.querySelector('[data-live="updatedAt"]');
        if (updated) updated.textContent = fmtDateTime(report.updatedAt);

        const inputs = node.querySelectorAll("[data-field]");
        inputs.forEach(inp => {
          const key = inp.getAttribute("data-field");
          const val = (report.fields[key] ?? "");
          if (inp.tagName === "INPUT") inp.value = val;
          if (key === "totalDue") inp.setAttribute("readonly","readonly");
        });
        return node;
      };

      const renderPaper = () => {
        el.paper.innerHTML = "";
        activePaper = buildPaper();
        el.paper.appendChild(activePaper);

        activePaper.addEventListener("input", (e) => {
          const t = e.target;
          const key = t?.getAttribute?.("data-field");
          if (!key) return;
          if (key === "totalDue") return;
          report.fields[key] = (t.tagName === "INPUT") ? t.value : "";
          if (key === "checkAmount" || key === "returnedFee") {
            computeTotalDue();
            const totalEl = activePaper.querySelector('[data-field="totalDue"]');
            if (totalEl) totalEl.value = report.fields.totalDue;
          }
          scheduleSave();
        });

        activePaper.addEventListener("blur", (e) => {
          const t = e.target;
          if (!(t instanceof HTMLInputElement)) return;
          const key = t.getAttribute("data-field");
          if (!key) return;
          if (key === "checkAmount" || key === "returnedFee") {
            const n = moneyToNumber(t.value);
            const pretty = formatMoney(n);
            t.value = pretty;
            report.fields[key] = pretty;
            computeTotalDue();
            const totalEl = activePaper.querySelector('[data-field="totalDue"]');
            if (totalEl) totalEl.value = report.fields.totalDue;
            scheduleSave();
          }
        }, true);
      };

      // Images: compress
      const fileToCompressedDataUrl = (file, maxSide = 1800, quality = 0.86) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("read error"));
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const w = img.width, h = img.height;
              const scale = Math.min(1, maxSide / Math.max(w, h));
              const nw = Math.round(w * scale);
              const nh = Math.round(h * scale);
              const canvas = document.createElement("canvas");
              canvas.width = nw;
              canvas.height = nh;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, nw, nh);
              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.onerror = () => reject(new Error("img error"));
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      };

      const renderImages = () => {
        const imgs = report.images || [];
        el.attCount.textContent = `${imgs.length} image(s)`;
        el.imagePages.innerHTML = "";
        if (!imgs.length) {
          el.imagesEmpty.style.display = "block";
          return;
        }
        el.imagesEmpty.style.display = "none";
        for (const im of imgs) {
          const page = document.createElement("div");
          page.className = "paper imagePaper";

          const top = document.createElement("div");
          top.className = "imageTop";
          const left = document.createElement("div");
          left.style.minWidth = "0";
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = im.name || "Image";
          const meta = document.createElement("div");
          meta.className = "metaSmall";
          meta.textContent = `Added: ${fmtDateTime(im.createdAt || report.updatedAt)}`;
          left.appendChild(name);
          left.appendChild(meta);

          const actions = document.createElement("div");
          const del = document.createElement("button");
          del.className = "miniBtn miniBtnDanger";
          del.textContent = "Borrar";
          del.addEventListener("click", (ev) => {
            ev.stopPropagation();
            const ok = confirm("¿Borrar esta imagen?");
            if (!ok) return;
            report.images = (report.images || []).filter(x => x.id !== im.id);
            scheduleSave();
            renderImages();
          });
          actions.appendChild(del);

          top.appendChild(left);
          top.appendChild(actions);

          const body = document.createElement("div");
          body.className = "imageBody";
          const img = document.createElement("img");
          img.src = im.dataUrl;
          img.alt = im.name || "image";
          img.addEventListener("click", () => {
            modalImageId = im.id;
            el.modalTitle.textContent = im.name || "Imagen";
            el.modalImg.src = im.dataUrl;
            el.modal.classList.add("show");
          });
          body.appendChild(img);

          page.appendChild(top);
          page.appendChild(body);
          el.imagePages.appendChild(page);
        }
      };

      const addImages = async (files) => {
        const list = Array.from(files || []);
        if (!list.length) return;
        for (const f of list) {
          try{
            const dataUrl = await fileToCompressedDataUrl(f);
            report.images = report.images || [];
            report.images.unshift({ id: uid(), name: f.name, dataUrl, createdAt: nowISO() });
          }catch{}
        }
        scheduleSave();
        renderImages();
      };

      const waitForImagesReady = async () => {
        const imgs = Array.from(document.images || []);
        await Promise.all(
          imgs.map((img) =>
            img.complete
              ? Promise.resolve()
              : new Promise((resolve) => {
                  img.addEventListener("load", resolve, { once: true });
                  img.addEventListener("error", resolve, { once: true });
                }),
          ),
        );
        await Promise.all(
          imgs.map((img) =>
            typeof img.decode === "function" ? img.decode().catch(() => undefined) : Promise.resolve(),
          ),
        );
        await new Promise((r) => requestAnimationFrame(() => r()));
      };

      const load = () => {
        // Prefer v3 (single report)
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            const norm = normalizeFromLegacy(parsed);
            if (norm) return norm;
          } catch {}
        }
        // Migrate legacy v2 per-note multi-report payload if present
        const rawV2 = localStorage.getItem(legacyKeyV2);
        if (rawV2) {
          try {
            const parsed = JSON.parse(rawV2);
            const norm = normalizeFromLegacy(parsed);
            if (norm) return norm;
          } catch {}
        }
        return blankReport();
      };

      // Init from parent (Supabase values._report)
      window.addEventListener("message", (ev) => {
        const data = ev?.data;
        if (!data || typeof data !== "object") return;
        if (data.type === "rc:preparePrint") {
          (async () => {
            try { await waitForImagesReady(); } catch {}
            if (canPostToParent) {
              try { window.parent.postMessage({ type: "rc:prepared", noteId }, "*"); } catch {}
            }
          })();
          return;
        }
        if (data.type !== "rc:init") return;
        if (data.noteId && String(data.noteId) !== String(noteId)) return;
        const norm = normalizeFromLegacy(data.initialReport);
        if (norm) {
          report = norm;
          computeTotalDue();
          persist(true);
          renderPaper();
          renderImages();
        }
      });

      // Events
      el.btnAddImages.addEventListener("click", () => el.imgPicker.click());
      el.imgPicker.addEventListener("change", async (e) => {
        await addImages(e.target.files);
        el.imgPicker.value = "";
      });

      el.btnPrint.addEventListener("click", () => {
        // Printing from inside a sandboxed iframe is often blocked on mobile.
        if (canPostToParent) {
          try { window.parent.postMessage({ type: "rc:print", noteId }, "*"); } catch {}
          return;
        }
        window.print();
      });

      el.modalClose.addEventListener("click", () => {
        modalImageId = null;
        el.modal.classList.remove("show");
        el.modalImg.src = "";
      });
      el.modal.addEventListener("click", (e) => { if (e.target === el.modal) el.modalClose.click(); });
      el.modalDelete.addEventListener("click", () => {
        if (!modalImageId) return;
        const ok = confirm("¿Borrar esta imagen?");
        if (!ok) return;
        report.images = (report.images || []).filter(im => im.id !== modalImageId);
        modalImageId = null;
        el.modal.classList.remove("show");
        el.modalImg.src = "";
        scheduleSave();
        renderImages();
      });

      // Boot
      report = load();
      computeTotalDue();
      persist(true);
      renderPaper();
      renderImages();
      el.lastSaved.textContent = `Última edición: ${fmtDateTime(report.updatedAt)}`;
    })();
  </script>
</body>
</html>
