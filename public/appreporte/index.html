<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Returned Checks</title>
  <style>
    :root{
      --bg:#f4f6fb;
      --ink:#111827;
      --muted:#6b7280;
      --line:#e5e7eb;
      --accent:#d11b2a;
      --label:#a6a6a6;
      --shadow: 0 18px 60px rgba(0,0,0,.10);
      --shadow2: 0 10px 22px rgba(0,0,0,.08);
      --radius:16px;

      /* Paper sizing */
      --paper-w: 860px;
      --paper-pad-x: 34px;
      --paper-pad-y: 26px;

      /* Thumbnail scale */
      --thumb-scale: .19;
      --paper-ratio: 1.294; /* 11/8.5 */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--ink);
      background: radial-gradient(1000px 500px at 20% 0%, rgba(209,27,42,.08), transparent 60%),
                  radial-gradient(900px 600px at 85% 20%, rgba(16,185,129,.08), transparent 55%),
                  var(--bg);
    }

    /* Top bar */
    .topbar{
      position:sticky; top:0; z-index:50;
      display:flex; align-items:center; gap:12px;
      padding:12px 14px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(10px);
      border-bottom:1px solid rgba(229,231,235,.75);
    }
    .brand{display:flex; align-items:center; gap:10px; min-width: 190px;}
    .hamburger{
      display:none;
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      height:38px; width:42px;
      box-shadow: 0 6px 18px rgba(0,0,0,.06);
      cursor:pointer;
    }
    .hamburger:active{transform: translateY(1px)}
    .logoDot{
      width:34px; height:34px; border-radius:12px;
      background: linear-gradient(135deg, rgba(209,27,42,.95), rgba(245,158,11,.95));
      box-shadow: 0 10px 20px rgba(209,27,42,.18);
    }
    .brandTitle{display:flex; flex-direction:column; line-height:1.05;}
    .brandTitle b{font-size:14px}
    .brandTitle span{font-size:12px; color:var(--muted)}
    .topbarRight{
      margin-left:auto;
      display:flex; gap:10px; align-items:center;
      width: min(740px, 100%);
    }
    .searchWrap{flex:1; display:flex; gap:10px; align-items:center;}
    .search{
      flex:1;
      display:flex; align-items:center; gap:8px;
      padding:10px 12px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      box-shadow: 0 10px 20px rgba(0,0,0,.06);
    }
    .search svg{opacity:.55}
    .search input{border:0; outline:0; width:100%; font-size:14px; background:transparent;}
    .btn{
      border:1px solid var(--line);
      background:#fff;
      padding:10px 12px;
      border-radius:14px;
      cursor:pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,.06);
      font-weight:700;
      font-size:13px;
      display:inline-flex; align-items:center; gap:8px;
      user-select:none;
      white-space:nowrap;
    }
    .btn:active{transform: translateY(1px)}
    .btnPrimary{
      border-color: rgba(209,27,42,.35);
      background: linear-gradient(180deg, rgba(209,27,42,.96), rgba(209,27,42,.90));
      color:#fff;
      box-shadow: 0 14px 26px rgba(209,27,42,.20);
    }
    .btnDanger{
      border-color: rgba(239,68,68,.35);
      background: linear-gradient(180deg, rgba(239,68,68,.96), rgba(239,68,68,.90));
      color:#fff;
      box-shadow: 0 14px 26px rgba(239,68,68,.18);
    }
    .btnGhost{box-shadow:none; background:transparent;}
    .iconBtn{
      width:38px; height:38px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      display:grid; place-items:center;
      box-shadow: 0 10px 18px rgba(0,0,0,.06);
    }
    .iconBtn:active{transform: translateY(1px)}

    /* Layout */
    .layout{
      display:grid;
      grid-template-columns: 330px 1fr;
      gap:14px;
      padding:14px;
    }
    aside{
      background: rgba(255,255,255,.78);
      border:1px solid rgba(229,231,235,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      overflow:hidden;
      min-height: calc(100vh - 92px);
    }
    .sideHead{
      padding:14px 14px 10px 14px;
      border-bottom:1px solid rgba(229,231,235,.85);
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
    }
    .sideHead .title{display:flex; flex-direction:column; gap:2px;}
    .sideHead .title b{font-size:14px}
    .sideHead .title span{font-size:12px; color:var(--muted)}
    .sideActions{display:flex; gap:8px; align-items:center;}
    .list{
      padding:10px;
      overflow:auto;
      max-height: calc(100vh - 92px - 70px);
    }
    .item{
      border:1px solid rgba(229,231,235,.95);
      background: rgba(255,255,255,.82);
      border-radius: 16px;
      overflow:hidden;
      margin-bottom:10px;
      cursor:pointer;
      box-shadow: 0 10px 18px rgba(0,0,0,.05);
      transition: transform .08s ease, box-shadow .08s ease, border-color .08s ease;
    }
    .item:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(0,0,0,.08);
      border-color: rgba(209,27,42,.20);
    }
    .item.active{
      border-color: rgba(209,27,42,.45);
      box-shadow: 0 18px 34px rgba(209,27,42,.14);
    }
    .thumb{
      background: linear-gradient(180deg, rgba(17,24,39,.03), rgba(17,24,39,.00));
      border-bottom: 1px solid rgba(229,231,235,.9);
      padding:10px 10px 0 10px;
    }
    .thumbStage{
      width: 100%;
      border-radius: 14px;
      background:#fff;
      border:1px solid rgba(229,231,235,.9);
      overflow:hidden;
      position:relative;
      height: calc((var(--paper-w) * var(--paper-ratio)) * var(--thumb-scale));
    }
    .thumbStage .paper{
      width: var(--paper-w);
      transform: scale(var(--thumb-scale));
      transform-origin: top left;
      pointer-events:none;
    }
    .meta{
      display:flex; gap:8px; align-items:flex-start;
      padding:10px 12px 12px 12px;
    }
    .meta .dot{
      width:10px; height:10px; border-radius:999px;
      margin-top:4px;
      background: rgba(209,27,42,.9);
      box-shadow: 0 10px 18px rgba(209,27,42,.18);
      flex:0 0 auto;
    }
    .meta .txt{min-width:0}
    .meta .txt b{
      display:block;
      font-size:13px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .meta .txt span{
      display:block;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin-top:2px;
    }

    main{min-height: calc(100vh - 92px); padding-bottom: 26px;}
    .mainShell{
      background: rgba(255,255,255,.58);
      border:1px solid rgba(229,231,235,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 14px;
      min-height: calc(100vh - 92px);
      overflow:hidden;
    }

    /* Paper */
    .paperWrap{
      display:flex;
      justify-content:center;
      padding: 10px 0 0 0;
    }
    .paper{
      width: min(var(--paper-w), 100%);
      background:#fff;
      border:1px solid rgba(209,27,42,.15);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: var(--paper-pad-y) var(--paper-pad-x);
      position:relative;
    }
    .paper:before{
      content:"";
      position:absolute; inset:0;
      border-radius: 18px;
      pointer-events:none;
      box-shadow: inset 0 0 0 1px rgba(17,24,39,.05);
    }

    .paperTop{
      display:grid;
      grid-template-columns: 1.2fr 1.1fr;
      gap: 10px;
      align-items:start;
    }
    .companyBlock{display:flex; flex-direction:column; gap:8px;}
    .companyName{
      font-size: 26px;
      letter-spacing:.5px;
      border:0;
      outline:0;
      padding:0 0 6px 0;
      border-bottom: 2px solid rgba(17,24,39,.15);
      width:100%;
      font-weight: 300;
      text-transform: uppercase;
      background: transparent;
    }
    .subline{display:flex; gap:10px; flex-wrap:wrap; color: var(--muted); font-size: 12px;}
    .brandRow{display:flex; align-items:center; gap:10px; margin-top: 2px;}
    .mark{
      width:70px; height:50px;
      border-radius:14px;
      border:1px solid rgba(229,231,235,.9);
      display:grid; place-items:center;
      overflow:hidden;
      background: radial-gradient(40px 40px at 30% 30%, rgba(245,158,11,.25), transparent 65%),
                  radial-gradient(60px 50px at 70% 70%, rgba(209,27,42,.18), transparent 65%),
                  #fff;
    }
    .storeInfo{
      text-align:left;
      font-size:12.5px;
      line-height: 1.35;
      color:#111827;
    }
    .storeInfo b{letter-spacing:.4px;}
    .titleCenter{
      margin: 16px 0 10px 0;
      text-align:center;
      font-size: 28px;
      letter-spacing:.8px;
      color: var(--accent);
      font-weight: 900;
      text-transform: uppercase;
    }

    /* Tables */
    table{width:100%; border-collapse:collapse; table-layout:fixed; font-size: 13px;}
    .gridBlock{border:1px solid rgba(17,24,39,.35);}
    .gridBlock td, .gridBlock th{border:1px solid rgba(17,24,39,.35); padding:8px 10px; vertical-align:middle;}
    .labelCell{
      width: 30%;
      background: var(--label);
      color:#0b0b0b;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing:.2px;
      text-align:center;
    }
    .valueCell{background:#fff;}
    .valueCell input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      font-size: 13px;
      padding:0;
    }
    .moneyRow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 14px;
      align-items:start;
    }
    .miniBlock{border:1px solid rgba(17,24,39,.35);}
    .miniBlock td, .miniBlock th{border:1px solid rgba(17,24,39,.35); padding:8px 10px; font-size: 13px;}
    .completedRow{margin-top: 16px;}

    /* Images as paper pages (same size as editable sheet) */
    .imagesSection{
      margin-top: 14px;
    }
    .imagesHead{
      width: min(var(--paper-w), 100%);
      margin: 0 auto 10px auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border:1px solid rgba(229,231,235,.9);
      border-radius: 16px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 10px 20px rgba(0,0,0,.05);
    }
    .imagesHead b{font-size:13px}
    .imagesHead span{font-size:12px; color:var(--muted)}
    .imagesPages{
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:center;
    }
    .imagePaper{
      padding: 18px 18px;
    }
    .imageTop{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding-bottom:10px;
      border-bottom: 1px solid rgba(229,231,235,.9);
      margin-bottom: 12px;
    }
    .imageTop .name{
      min-width:0;
      font-size:13px;
      font-weight:900;
      color:#111827;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .imageTop .metaSmall{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }
    .imageActions{display:flex; gap:10px; align-items:center;}
    .miniBtn{
      border:1px solid rgba(229,231,235,.95);
      background:#fff;
      border-radius: 12px;
      padding:8px 10px;
      cursor:pointer;
      font-size:12px;
      font-weight:900;
      box-shadow: 0 10px 18px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .miniBtn:active{transform: translateY(1px)}
    .miniBtnDanger{
      border-color: rgba(239,68,68,.35);
      color:#fff;
      background: linear-gradient(180deg, rgba(239,68,68,.96), rgba(239,68,68,.90));
      box-shadow: 0 14px 26px rgba(239,68,68,.18);
    }
    .imageBody{
      display:flex;
      justify-content:center;
      align-items:center;
      padding: 6px 0 2px 0;
    }
    .imageBody img{
      width: 100%;
      height: auto;
      max-height: calc((var(--paper-w) * var(--paper-ratio)) - 140px);
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid rgba(229,231,235,.9);
      box-shadow: 0 12px 26px rgba(0,0,0,.08);
      cursor:pointer;
      background:#fff;
    }
    .imagesEmpty{
      width: min(var(--paper-w), 100%);
      margin: 0 auto;
      padding: 14px;
      text-align:center;
      color: var(--muted);
      font-weight: 800;
      border: 1px dashed rgba(107,114,128,.35);
      border-radius: 16px;
      background: rgba(243,244,246,.55);
    }

    /* Bottom actions */
    .bottomBar{
      position: sticky;
      bottom: 12px;
      margin-top: 16px;
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .bottomBarInner{
      pointer-events:auto;
      background: rgba(255,255,255,.86);
      border:1px solid rgba(229,231,235,.95);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,.10);
      padding:10px;
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      justify-content:center;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      padding: 8px 10px;
      border-radius: 14px;
      border:1px dashed rgba(107,114,128,.35);
      background: rgba(243,244,246,.55);
    }

    /* Modal */
    .modal{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:999;
      padding: 16px;
    }
    .modal.show{display:flex}
    .modalCard{
      width: min(980px, 100%);
      background:#fff;
      border-radius: 18px;
      border:1px solid rgba(229,231,235,.95);
      box-shadow: 0 30px 80px rgba(0,0,0,.22);
      overflow:hidden;
    }
    .modalTop{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding: 10px 12px;
      border-bottom:1px solid rgba(229,231,235,.95);
    }
    .modalTop b{font-size:13px}
    .modalBody{
      padding: 12px;
      background: #0b1220;
      display:flex;
      justify-content:center;
    }
    .modalBody img{
      max-width:100%;
      max-height: 70vh;
      border-radius: 14px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    /* Toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(17,24,39,.92);
      color:#fff;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      box-shadow: 0 18px 60px rgba(0,0,0,.25);
      display:none;
      z-index: 1000;
    }
    .toast.show{display:block}

    /* Responsive */
    @media (max-width: 1020px){
      .layout{grid-template-columns: 1fr}
      aside{
        position:fixed; inset: 64px 14px 14px 14px;
        z-index: 60;
        transform: translateX(-110%);
        transition: transform .18s ease;
      }
      aside.show{transform: translateX(0)}
      .hamburger{display:inline-grid}
      .brand{min-width:auto}
      .topbarRight{width:auto}
    }

    /* Print */
    @media print{
      body{background:#fff}
      .topbar, aside, .bottomBar{display:none !important}
      .mainShell{
        border:0 !important;
        box-shadow:none !important;
        background:#fff !important;
        padding:0 !important;
        min-height:auto !important;
      }
      .paper{
        box-shadow:none !important;
        border: 1px solid #000 !important;
        border-radius:0 !important;
        width: 8.5in !important;
      }
      .imagesHead{display:none !important}
      .imageBody img{
        box-shadow:none !important;
        border:1px solid #000 !important;
        border-radius:0 !important;
        background:#fff !important;
      }
      .imageTop{display:none !important}
      .imagePaper{
        border-radius:0 !important;
        padding: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="hamburger" id="btnMenu" title="Menú">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <div class="brand">
      <div class="logoDot"></div>
      <div class="brandTitle">
        <b>Returned Checks</b>
        <span>Editable reports</span>
      </div>
    </div>

    <div class="topbarRight">
      <div class="searchWrap">
        <div class="search" title="Buscar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="2"/>
            <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" placeholder="Buscar por compañía, payee, check #, etc." />
        </div>

        <button class="btn btnPrimary" id="btnNewTop" title="Nuevo">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Nuevo
        </button>
      </div>
    </div>
  </div>

  <div class="layout">
    <aside id="sidebar">
      <div class="sideHead">
        <div class="title">
          <b>Reports</b>
          <span id="countText">0</span>
        </div>
        <div class="sideActions">
          <button class="iconBtn" id="btnExport" title="Exportar respaldo (JSON)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 3v10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M8 9l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 17v3h16v-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="iconBtn" id="btnImport" title="Importar respaldo (JSON)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M12 21V11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M16 15l-4-4-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 4v3h16V4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="list" id="list"></div>
    </aside>

    <main>
      <div class="mainShell">
        <div class="paperWrap" id="paperWrap"></div>

        <!-- Images as full paper pages -->
        <div class="imagesSection" id="imagesSection">
          <div class="imagesHead">
            <div>
              <b>Images</b>
              <span id="attCount">0</span>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
              <input id="imgPicker" type="file" accept="image/*" multiple style="display:none" />
              <button class="btn" id="btnAddImages">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                Agregar imágenes
              </button>
            </div>
          </div>

          <div class="imagesPages" id="imagePages"></div>
          <div class="imagesEmpty" id="imagesEmpty" style="display:none;">No hay imágenes. Usa “Agregar imágenes”.</div>
        </div>

        <div class="bottomBar">
          <div class="bottomBarInner">
            <div class="pill" id="lastSaved">Sin cambios</div>
            <button class="btn" id="btnPrint">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M7 8V4h10v4" stroke="currentColor" stroke-width="2"/>
                <path d="M6 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1" stroke="currentColor" stroke-width="2"/>
                <path d="M7 14h10v6H7z" stroke="currentColor" stroke-width="2"/>
              </svg>
              Imprimir
            </button>
            <button class="btn" id="btnDuplicate">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M9 9h10v10H9z" stroke="currentColor" stroke-width="2"/>
                <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="2"/>
              </svg>
              Duplicar
            </button>
            <button class="btn btnDanger" id="btnDelete">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M4 7h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M10 11v6M14 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M6 7l1 14h10l1-14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M9 7V4h6v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              Borrar
            </button>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Paper template (NO NOTES) -->
  <template id="paperTemplate">
    <div class="paper">
      <div class="paperTop">
        <div class="companyBlock">
          <input class="companyName" data-field="companyName" placeholder="COMPANY NAME" />
          <div class="subline">
            <span>Last updated:</span>
            <span data-live="updatedAt">—</span>
          </div>
          <div class="brandRow">
            <div class="mark" title="Logo">
              <svg width="66" height="46" viewBox="0 0 66 46" fill="none" aria-hidden="true">
                <path d="M33 6c6.2 0 11.2 5 11.2 11.2S39.2 28.4 33 28.4 21.8 23.4 21.8 17.2 26.8 6 33 6Z" fill="rgba(16,185,129,.28)"/>
                <path d="M33 2v6M33 38v6M8 17h6M52 17h6M14 7l4 4M48 31l4 4M52 7l-4 4M14 31l-4 4" stroke="rgba(245,158,11,.85)" stroke-width="2" stroke-linecap="round"/>
                <text x="33" y="22" text-anchor="middle" font-size="10" font-weight="900" fill="rgba(209,27,42,.95)">LA</text>

            <td class="valueCell"><input data-field="totalDue" placeholder="$0.00" readonly /></td>

        <table class="miniBlock">
          <tr>
            <td class="labelCell">DATE FEE PAID</td>

            <td class="labelCell">FORM OF PAYMENT</td>
            <td class="valueCell"><input data-field="feePaymentMethod" placeholder="" /></td>
          </tr>
          <tr>
            <td class="labelCell">DATE CHECK PAID</td>
            <td class="valueCell"><input data-field="dateCheckPaid" placeholder="" /></td>
          </tr>
          <tr>
            <td class="labelCell">FORM OF PAYMENT</td>
            <td class="valueCell"><input data-field="checkPaymentMethod" placeholder="" /></td>

      <div class="completedRow">
        <table class="miniBlock">
          <tr>
            <td class="labelCell">DATE COMPLETED</td>
            <td class="valueCell"><input data-field="dateCompleted" placeholder="" /></td>

  <!-- Image modal -->
  <div class="modal" id="modal">
    <div class="modalCard">
      <div class="modalTop">
        <b id="modalTitle">Image</b>
        <div style="display:flex; gap:10px; align-items:center;">
          <button class="btn btnDanger" id="modalDelete">Borrar imagen</button>
          <button class="btn" id="modalClose">Cerrar</button>
        </div>
      </div>
      <div class="modalBody">
        <img id="modalImg" alt="preview" />
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Guardado</div>
  <input id="importFile" type="file" accept="application/json" style="display:none" />
  <script>
    (() => {
      const STORAGE_KEY = "returnedChecks.v2";

      const state = {
        reports: [],
        activeId: null,
        query: ""
      };

      const el = {
        sidebar: document.getElementById("sidebar"),
        btnMenu: document.getElementById("btnMenu"),
        list: document.getElementById("list"),
        paperWrap: document.getElementById("paperWrap"),
        searchInput: document.getElementById("searchInput"),
        btnNewTop: document.getElementById("btnNewTop"),
        btnDelete: document.getElementById("btnDelete"),
        btnPrint: document.getElementById("btnPrint"),
        btnDuplicate: document.getElementById("btnDuplicate"),
        countText: document.getElementById("countText"),
        lastSaved: document.getElementById("lastSaved"),
        toast: document.getElementById("toast"),

        imagePages: document.getElementById("imagePages"),
        imagesEmpty: document.getElementById("imagesEmpty"),
        attCount: document.getElementById("attCount"),
        imgPicker: document.getElementById("imgPicker"),
        btnAddImages: document.getElementById("btnAddImages"),

        modal: document.getElementById("modal"),
        modalImg: document.getElementById("modalImg"),
        modalTitle: document.getElementById("modalTitle"),
        modalClose: document.getElementById("modalClose"),
        modalDelete: document.getElementById("modalDelete"),

        btnExport: document.getElementById("btnExport"),
        btnImport: document.getElementById("btnImport"),
        importFile: document.getElementById("importFile"),
        paperTemplate: document.getElementById("paperTemplate")
      };

      let activePaper = null;
      let saveTimer = null;
      let toastTimer = null;
      let modalImageId = null;

      const nowISO = () => new Date().toISOString();
      const fmtDateTime = (iso) => {
        try{
          const d = new Date(iso);
          return d.toLocaleString(undefined, {year:"numeric", month:"short", day:"2-digit", hour:"2-digit", minute:"2-digit"});
        }catch{ return "—"; }
      };
      const moneyToNumber = (v) => {
        if (v == null) return 0;
        const s = String(v).replace(/[^0-9.\-]/g,"").trim();
        const n = Number(s);
        return Number.isFinite(n) ? n : 0;
      };
      const formatMoney = (n) => {
        const x = Number(n);
        if (!Number.isFinite(x)) return "";
        return "$" + x.toFixed(2);
      };
      const uid = () => (crypto?.randomUUID ? crypto.randomUUID() : ("id-" + Math.random().toString(16).slice(2) + Date.now()));

      const makeBlankReport = () => {
        const id = uid();
        return {
          id,
          createdAt: nowISO(),
          updatedAt: nowISO(),
          fields: {
            companyName: "COMPANY NAME",
            dateCashed: "",
            dateDeposit: "",
            dateReturned: "",
            payee: "",
            checkNumber: "",
            makerPayor: "",
            rejectReason: "",
            customerContact: "",
            companyContact: "",
            checkAmount: "",
            returnedFee: "",
            totalDue: "$0.00",
            dateFeePaid: "",
            feePaymentMethod: "",
            dateCheckPaid: "",
            checkPaymentMethod: "",
            dateCompleted: "",
            agentCompleted: ""
          },
          images: [] // {id, name, dataUrl, createdAt}
        };
      };

      const load = () => {
        // Try v2 first
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.reports)) {
              state.reports = parsed.reports;
              state.activeId = parsed.activeId || (state.reports[0]?.id ?? null);
              return;
            }
          } catch {}
        }

        // Backward compatibility: migrate from older key if exists
        const oldRaw = localStorage.getItem("returnedChecks.v1");
        if (oldRaw) {
          try {
            const parsed = JSON.parse(oldRaw);
            if (parsed && Array.isArray(parsed.reports)) {
              // Remove old "notes" if present, silently
              parsed.reports.forEach(r => {
                if (r?.fields && "notes" in r.fields) delete r.fields.notes;
              });
              state.reports = parsed.reports;
              state.activeId = parsed.activeId || (state.reports[0]?.id ?? null);
              persist(true);
              return;
            }
          } catch {}
        }

        // First run
        const first = makeBlankReport();
        first.fields.companyName = "NEW ITALIAN GRILL";
        first.fields.payee = "ROBERTO RAMIREZ";
        first.fields.checkNumber = "10705";
        first.fields.makerPayor = "NEW ITALIAN GRILL CORP";
        first.fields.rejectReason = "NSF";
        first.fields.customerContact = "941-320-7574";
        first.fields.companyContact = "KENNETH 941-966-6565";
        first.fields.checkAmount = "$200.24";
        first.fields.returnedFee = "$30.00";
        first.fields.totalDue = "$230.24";
        state.reports = [first];
        state.activeId = first.id;
        persist(true);
      };

      const persist = (silent=false) => {
        const payload = { reports: state.reports, activeId: state.activeId };
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          if (!silent) showToast("Guardado");
        } catch {
          showToast("No se pudo guardar (storage lleno).");
        }
      };

      const scheduleSave = () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => persist(false), 350);
      };

      const showToast = (msg) => {
        el.toast.textContent = msg;
        el.toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove("show"), 1200);
      };

      const getActive = () => state.reports.find(r => r.id === state.activeId) || null;
      const sortReports = (arr) => arr.slice().sort((a,b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));

      const matchesQuery = (report, q) => {
        if (!q) return true;
        const t = q.toLowerCase().trim();
        const f = report.fields || {};
        const hay = [
          f.companyName, f.payee, f.checkNumber, f.makerPayor, f.customerContact, f.companyContact, f.rejectReason
        ].join(" ").toLowerCase();
        return hay.includes(t);
      };

      const computeTotalDue = (checkAmount, returnedFee) => {
        const total = moneyToNumber(checkAmount) + moneyToNumber(returnedFee);
        return formatMoney(total);
      };

      const buildPaperNode = (report, {readonly}) => {
        const frag = el.paperTemplate.content.cloneNode(true);
        const paper = frag.querySelector(".paper");
        applyFieldsToPaper(paper, report, {readonly});
        return paper;
      };

      const applyFieldsToPaper = (paper, report, {readonly}) => {
        const f = report.fields || {};
        const updated = paper.querySelector('[data-live="updatedAt"]');
        if (updated) updated.textContent = fmtDateTime(report.updatedAt);

        const inputs = paper.querySelectorAll("[data-field]");
        inputs.forEach(inp => {
          const key = inp.getAttribute("data-field");
          const val = (f[key] ?? "");
          if (inp.tagName === "INPUT") inp.value = val;

          if (readonly) {
            inp.setAttribute("readonly", "readonly");
            inp.tabIndex = -1;
          } else {
            if (key !== "totalDue") inp.removeAttribute("readonly");
          }
        });

        const total = computeTotalDue(f.checkAmount, f.returnedFee);
        const totalEl = paper.querySelector('[data-field="totalDue"]');
        if (totalEl) totalEl.value = total;

        if (readonly) paper.style.pointerEvents = "none";
      };

      const renderSidebar = () => {
        const filtered = sortReports(state.reports).filter(r => matchesQuery(r, state.query));
        el.countText.textContent = `${filtered.length} report(s)`;
        el.list.innerHTML = "";

        for (const r of filtered) {
          const item = document.createElement("div");
          item.className = "item" + (r.id === state.activeId ? " active" : "");
          item.dataset.id = r.id;

          const thumb = document.createElement("div");
          thumb.className = "thumb";
          const stage = document.createElement("div");
          stage.className = "thumbStage";
          stage.appendChild(buildPaperNode(r, {readonly:true}));
          thumb.appendChild(stage);

          const meta = document.createElement("div");
          meta.className = "meta";
          const dot = document.createElement("div");
          dot.className = "dot";

          const txt = document.createElement("div");
          txt.className = "txt";
          const title = document.createElement("b");
          title.textContent = (r.fields?.companyName || "COMPANY NAME").toUpperCase();

          const sub = document.createElement("span");
          const amt = (r.fields?.totalDue || "").trim() || "$0.00";
          sub.textContent = `Total due: ${amt} • ${fmtDateTime(r.updatedAt)}`;

          txt.appendChild(title);
          txt.appendChild(sub);

          meta.appendChild(dot);
          meta.appendChild(txt);

          item.appendChild(thumb);
          item.appendChild(meta);

          item.addEventListener("click", () => {
            state.activeId = r.id;
            persist(true);
            renderAll();
            closeSidebarOnMobile();
          });

          el.list.appendChild(item);
        }
      };

      const updateLastSavedPill = (iso) => {
        el.lastSaved.textContent = `Última edición: ${fmtDateTime(iso)}`;
      };

      const renderMain = () => {
        const report = getActive();
        el.paperWrap.innerHTML = "";
        el.imagePages.innerHTML = "";

        if (!report) {
          const div = document.createElement("div");
          div.style.padding = "20px";
          div.innerHTML = `<div style="text-align:center;color:var(--muted);font-weight:800;">No hay report seleccionado.</div>`;
          el.paperWrap.appendChild(div);
          el.attCount.textContent = "0 image(s)";
          el.imagesEmpty.style.display = "block";
          return;
        }

        activePaper = buildPaperNode(report, {readonly:false});
        el.paperWrap.appendChild(activePaper);

        activePaper.addEventListener("input", (e) => {
          const t = e.target;
          const key = t?.getAttribute?.("data-field");
          if (!key) return;

          const r = getActive();
          if (!r) return;

          if (key === "totalDue") return;

          const val = (t.tagName === "INPUT") ? t.value : "";
          r.fields[key] = val;

          if (key === "checkAmount" || key === "returnedFee") {
            r.fields.totalDue = computeTotalDue(r.fields.checkAmount, r.fields.returnedFee);
            const totalEl = activePaper.querySelector('[data-field="totalDue"]');
            if (totalEl) totalEl.value = r.fields.totalDue;
          }

          r.updatedAt = nowISO();
          el.lastSaved.textContent = "Guardando…";
          scheduleSave();
          renderSidebar();
          updateLastSavedPill(r.updatedAt);
        });

        activePaper.addEventListener("blur", (e) => {
          const t = e.target;
          if (!(t instanceof HTMLInputElement)) return;
          const key = t.getAttribute("data-field");
          if (!key) return;

          if (key === "checkAmount" || key === "returnedFee") {
            const r = getActive();
            if (!r) return;

            const n = moneyToNumber(t.value);
            const pretty = formatMoney(n);
            t.value = pretty;
            r.fields[key] = pretty;

            r.fields.totalDue = computeTotalDue(r.fields.checkAmount, r.fields.returnedFee);
            const totalEl = activePaper.querySelector('[data-field="totalDue"]');
            if (totalEl) totalEl.value = r.fields.totalDue;

            r.updatedAt = nowISO();
            scheduleSave();
            renderSidebar();
            updateLastSavedPill(r.updatedAt);
          }
        }, true);

        renderImagePages(report);
        updateLastSavedPill(report.updatedAt);
      };

      const renderImagePages = (report) => {
        const imgs = report.images || [];
        el.attCount.textContent = `${imgs.length} image(s)`;
        el.imagePages.innerHTML = "";

        if (!imgs.length) {
          el.imagesEmpty.style.display = "block";
          return;
        }
        el.imagesEmpty.style.display = "none";

        for (const im of imgs) {
          const page = document.createElement("div");
          page.className = "paper imagePaper";
          page.dataset.id = im.id;

          const top = document.createElement("div");
          top.className = "imageTop";

          const left = document.createElement("div");
          left.style.minWidth = "0";

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = im.name || "Image";

          const meta = document.createElement("div");
          meta.className = "metaSmall";
          meta.textContent = `Added: ${fmtDateTime(im.createdAt || report.updatedAt)}`;

          left.appendChild(name);
          left.appendChild(meta);

          const actions = document.createElement("div");
          actions.className = "imageActions";

          const del = document.createElement("button");
          del.className = "miniBtn miniBtnDanger";
          del.textContent = "Borrar";
          del.addEventListener("click", (ev) => {
            ev.stopPropagation();
            removeImage(im.id);
          });

          actions.appendChild(del);

          top.appendChild(left);
          top.appendChild(actions);

          const body = document.createElement("div");
          body.className = "imageBody";

          const img = document.createElement("img");
          img.src = im.dataUrl;
          img.alt = im.name || "image";
          img.addEventListener("click", () => openModal(im.id));

          body.appendChild(img);

          page.appendChild(top);
          page.appendChild(body);

          el.imagePages.appendChild(page);
        }
      };

      const addNewReport = () => {
        const r = makeBlankReport();
        state.reports.unshift(r);
        state.activeId = r.id;
        persist(true);
        renderAll();
        showToast("Nuevo report creado");
      };

      const deleteActiveReport = () => {
        const r = getActive();
        if (!r) return;
        const ok = confirm(`¿Seguro que quieres borrar este report?\n\n${(r.fields.companyName || "COMPANY NAME").toUpperCase()}`);
        if (!ok) return;

        state.reports = state.reports.filter(x => x.id !== r.id);
        state.activeId = state.reports[0]?.id ?? null;
        persist(true);
        renderAll();
        showToast("Report borrado");
      };

      const duplicateActiveReport = () => {
        const r = getActive();
        if (!r) return;

        const copy = JSON.parse(JSON.stringify(r));
        copy.id = uid();
        copy.createdAt = nowISO();
        copy.updatedAt = nowISO();
        copy.fields.companyName = (copy.fields.companyName || "COMPANY NAME") + " (COPY)";
        copy.images = (copy.images || []).map(im => ({...im, id: uid(), createdAt: nowISO()}));

        state.reports.unshift(copy);
        state.activeId = copy.id;
        persist(true);
        renderAll();
        showToast("Duplicado");
      };

      const closeSidebarOnMobile = () => {
        if (window.matchMedia("(max-width: 1020px)").matches) el.sidebar.classList.remove("show");
      };
      const toggleSidebarOnMobile = () => el.sidebar.classList.toggle("show");

      const exportBackup = () => {
        const payload = { reports: state.reports, exportedAt: nowISO() };
        const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `returned-checks-backup-${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      };

      const importBackup = async (file) => {
        const text = await file.text();
        let parsed;
        try { parsed = JSON.parse(text); } catch { alert("JSON inválido."); return; }
        if (!parsed || !Array.isArray(parsed.reports)) { alert("Ese archivo no parece ser un respaldo válido."); return; }

        const ok = confirm("Esto reemplazará tus reports actuales. ¿Continuar?");
        if (!ok) return;

        parsed.reports.forEach(r => { if (r?.fields && "notes" in r.fields) delete r.fields.notes; });

        state.reports = parsed.reports;
        state.activeId = state.reports[0]?.id ?? null;
        persist(true);
        renderAll();
        showToast("Importado");
      };

      // Images: compress
      const fileToCompressedDataUrl = (file, maxSide = 1800, quality = 0.86) => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error("read error"));
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const w = img.width, h = img.height;
              const scale = Math.min(1, maxSide / Math.max(w, h));
              const nw = Math.round(w * scale);
              const nh = Math.round(h * scale);

              const canvas = document.createElement("canvas");
              canvas.width = nw;
              canvas.height = nh;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, nw, nh);

              const out = canvas.toDataURL("image/jpeg", quality);
              resolve(out);
            };
            img.onerror = () => reject(new Error("img error"));
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      };

      const addImages = async (files) => {
        const r = getActive();
        if (!r) return;

        const list = Array.from(files || []);
        if (!list.length) return;

        showToast("Procesando imágenes…");

        for (const f of list) {
          try{
            const dataUrl = await fileToCompressedDataUrl(f);
            r.images = r.images || [];
            r.images.unshift({ id: uid(), name: f.name, dataUrl, createdAt: nowISO() });
          }catch{}
        }

        r.updatedAt = nowISO();
        scheduleSave();
        renderImagePages(r);
        renderSidebar();
        updateLastSavedPill(r.updatedAt);
        showToast("Imágenes agregadas");
      };

      const removeImage = (imgId) => {
        const r = getActive();
        if (!r) return;

        const ok = confirm("¿Borrar esta imagen?");
        if (!ok) return;

        r.images = (r.images || []).filter(im => im.id !== imgId);
        r.updatedAt = nowISO();
        scheduleSave();
        renderImagePages(r);
        renderSidebar();
        updateLastSavedPill(r.updatedAt);
        showToast("Imagen borrada");
      };

      const openModal = (imgId) => {
        const r = getActive();
        if (!r) return;
        const im = (r.images || []).find(x => x.id === imgId);
        if (!im) return;

        modalImageId = imgId;
        el.modalTitle.textContent = im.name || "Image";
        el.modalImg.src = im.dataUrl;
        el.modal.classList.add("show");
      };

      const closeModal = () => {
        modalImageId = null;
        el.modal.classList.remove("show");
        el.modalImg.src = "";
      };

      const renderAll = () => {
        renderSidebar();
        renderMain();
      };

      // Events
      el.btnMenu.addEventListener("click", toggleSidebarOnMobile);

      el.searchInput.addEventListener("input", () => {
        state.query = el.searchInput.value || "";
        renderSidebar();
      });

      el.btnNewTop.addEventListener("click", addNewReport);
      el.btnDelete.addEventListener("click", deleteActiveReport);
      el.btnPrint.addEventListener("click", () => window.print());
      el.btnDuplicate.addEventListener("click", duplicateActiveReport);

      el.btnAddImages.addEventListener("click", () => el.imgPicker.click());
      el.imgPicker.addEventListener("change", async (e) => {
        await addImages(e.target.files);
        el.imgPicker.value = "";
      });

      el.modalClose.addEventListener("click", closeModal);
      el.modal.addEventListener("click", (e) => { if (e.target === el.modal) closeModal(); });
      el.modalDelete.addEventListener("click", () => {
        if (!modalImageId) return;
        removeImage(modalImageId);
        closeModal();
      });

      el.btnExport.addEventListener("click", exportBackup);
      el.btnImport.addEventListener("click", () => el.importFile.click());
      el.importFile.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (file) await importBackup(file);
        el.importFile.value = "";
      });

      window.addEventListener("resize", () => {
        if (!window.matchMedia("(max-width: 1020px)").matches) el.sidebar.classList.remove("show");
      });

      // Boot
      load();
      renderAll();
    })();
  </script>
</body>
</html>
